<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamo IT Portal</title>
<meta name="description" content="Kamo IT Portal – cổng truy cập ứng dụng nội bộ Công ty TNHH Kamo">
<meta name="theme-color" content="#0c1f45">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kamo IT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0a1a3b;--bg2:#12306a;--bg3:#1d4f96;--yellow:#f5c518;--yellow-2:#ffd84d;--txt:#fff;--dim:rgba(255,255,255,.62);
  --navy:#12306a;--ink:#14213d;--muted:#64748b;--line:#e3e8f0;--red:#dc2626;--green:#16a34a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;
  background:
    radial-gradient(900px 520px at 50% 38%,rgba(45,110,200,.42),transparent 70%),
    linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 60%,#163f80 100%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.2px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 30%,transparent 80%)}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== Thanh tren ===== */
.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 32px}
.logo{height:30px;width:auto;display:block}
.logo-txt{font-weight:600;letter-spacing:2px;color:var(--yellow);font-size:24px}
.tr{display:flex;align-items:center;gap:14px}
.clock{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.gear{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--dim);transition:.15s}
.gear.on{color:var(--yellow);border-color:rgba(245,197,24,.5)}
.gear:hover,.gear:focus-visible{color:var(--yellow);border-color:rgba(245,197,24,.5);background:rgba(245,197,24,.08);outline:none}
.gear svg{width:17px;height:17px}

/* ===== Thanh che do cau hinh ===== */
.adm{position:relative;z-index:5;margin:0 auto;width:min(1100px,calc(100% - 40px));display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.4);border-radius:14px;padding:9px 10px 9px 16px;font-size:13.5px}
.adm .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px rgba(245,197,24,.2)}
.adm b{color:var(--yellow);font-weight:600}
.adm .who{color:var(--dim)}
.adm .sm{display:none}
.adm .sp{flex:1}
.ab{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:600;transition:.15s}
.ab.y{background:var(--yellow);color:#1b2a4a}.ab.y:hover{background:var(--yellow-2)}
.ab.g{background:rgba(255,255,255,.1);color:#fff}.ab.g:hover{background:rgba(255,255,255,.18)}
.ab.r{background:transparent;color:#fca5a5}.ab.r:hover{background:rgba(220,38,38,.15)}

/* ===== Trung tam ===== */
main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 40px;text-align:center}
h1{margin:0;font-size:46px;font-weight:300;letter-spacing:-.5px;line-height:1.1}
h1 span{color:var(--yellow);font-weight:400}
.lead{margin:14px 0 0;font-size:15px;color:var(--dim)}
.srch{position:relative;margin-top:28px;width:min(360px,100%)}
.srch input{width:100%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:11px 40px 11px 40px;font:inherit;font-size:14px;outline:none;transition:.15s}
.srch input::placeholder{color:rgba(255,255,255,.45)}
.srch input:focus{border-color:rgba(245,197,24,.6);background:rgba(255,255,255,.1)}
.srch .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.5)}
.srch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px Inter,sans-serif;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:2px 7px}

.apps{display:flex;flex-wrap:wrap;justify-content:center;gap:40px 64px;margin-top:56px;max-width:1100px}
.srch:not(.hidden) + .apps{margin-top:40px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;text-decoration:none;color:var(--txt);outline:none;width:180px;border-radius:20px}
.ic{width:128px;height:128px;border-radius:32px;display:grid;place-items:center;position:relative;
  background:linear-gradient(150deg,#2a6fd0 0%,#173f86 100%);box-shadow:0 18px 40px rgba(5,20,60,.55);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.ic svg{width:58px;height:58px;fill:none;stroke:var(--yellow);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.15)}
.app:hover .ic,.app:focus-visible .ic{transform:translateY(-6px) scale(1.04);box-shadow:0 26px 50px rgba(5,20,60,.7),0 0 0 6px rgba(245,197,24,.22)}
.app:active .ic{transform:scale(.97)}
.nm{font-size:17px;font-weight:500;letter-spacing:.1px;max-width:100%;overflow-wrap:anywhere}
.ds{font-size:13px;color:var(--dim);line-height:1.5;margin-top:-8px;max-width:100%;overflow-wrap:anywhere}
.kh{position:absolute;top:-6px;left:calc(50% + 50px);font:600 11px Inter,sans-serif;color:#1b2a4a;background:var(--yellow);border-radius:6px;padding:2px 6px;opacity:0;transform:translateY(4px);transition:.15s;pointer-events:none}
.app:hover .kh,.app:focus-visible .kh{opacity:1;transform:none}
.apps.many{gap:36px 44px}
.apps.many .app{width:150px}
.apps.many .ic{width:108px;height:108px;border-radius:28px}
.apps.many .ic svg{width:48px;height:48px}
.apps.many .kh{left:calc(50% + 40px)}
.empty{color:var(--dim);font-size:14px;padding:30px 0}

/* che do cau hinh: tile */
body.edit .app{cursor:grab}
body.edit .app .kh{display:none}
body.edit .app .ic{outline:2px dashed rgba(245,197,24,.0);outline-offset:6px}
body.edit .app:hover .ic{outline-color:rgba(245,197,24,.6)}
.app.off .ic{filter:grayscale(.75);opacity:.45}
.app.off .nm,.app.off .ds{opacity:.5}
.tag{position:absolute;top:96px;left:50%;transform:translateX(-50%);font:600 10.5px Inter,sans-serif;letter-spacing:.4px;color:#fff;background:#475569;border-radius:999px;padding:3px 9px;white-space:nowrap}
.apps.many .tag{top:78px}
.ctl{position:absolute;top:-12px;right:6px;display:flex;gap:4px;z-index:2}
.apps.many .ctl{right:-2px}
.ctl button{width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;background:#fff;color:var(--navy);box-shadow:0 4px 12px rgba(0,0,0,.3);transition:.12s}
.ctl button:hover{background:var(--yellow)}
.ctl button svg{width:15px;height:15px}
.app.drag{opacity:.35}
.app.over .ic{box-shadow:0 0 0 4px var(--yellow),0 18px 40px rgba(5,20,60,.55)}
.add .ic{background:rgba(255,255,255,.04);border:2px dashed rgba(245,197,24,.55);box-shadow:none}
.add .ic:after{display:none}
.add .ic svg{stroke:var(--yellow)}
.add:hover .ic{background:rgba(245,197,24,.08)}

/* ===== Chan trang: Ho tro IT ===== */
footer{position:relative;padding:0 24px calc(14px + env(safe-area-inset-bottom))}
.sup{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:linear-gradient(100deg,#12306a 0%,#1d4f96 100%);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 14px 12px 22px;box-shadow:0 10px 30px rgba(3,12,35,.35)}
.sup-l{display:flex;align-items:center;gap:10px;color:var(--yellow);font-weight:700;font-size:14px;letter-spacing:1.5px;white-space:nowrap}
.sup-l svg{width:20px;height:20px;fill:none;stroke:var(--yellow);stroke-width:2;stroke-linecap:round}
.sup-r{display:flex;align-items:center;background:rgba(255,255,255,.1);border-radius:999px;padding:8px 6px}
.sup-r .it{display:flex;align-items:center;gap:9px;padding:2px 16px;color:#fff;text-decoration:none;font-size:14.5px;white-space:nowrap}
.sup-r .it + .it{border-left:1px solid rgba(255,255,255,.28)}
.sup-r a.it:hover{color:var(--yellow)}
.sup-r svg{width:17px;height:17px;fill:#fff;flex:none}
.sup-r a.it:hover svg{fill:var(--yellow)}
.copy{text-align:center;font-size:12px;color:var(--dim);margin-top:12px}

/* ===== Hop thoai (nen trang) ===== */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(5,14,35,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fi .15s}
@keyframes fi{from{opacity:0}}
.dlg{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#fff;color:var(--ink);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:left;animation:up .18s cubic-bezier(.2,.8,.2,1)}
.dlg.sm{width:min(400px,100%)}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.dh{display:flex;align-items:center;gap:10px;padding:18px 22px 6px}
.dh h3{margin:0;font-size:17px;font-weight:600;color:var(--navy);flex:1}
.x{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.x:hover{background:#f1f5f9;color:var(--ink)}
.db{padding:10px 22px 6px}
.df{display:flex;align-items:center;gap:8px;padding:14px 22px 20px}
.df .sp{flex:1}
.f{margin-bottom:14px}
.f label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:6px}
.f label small{font-weight:500;color:#94a3b8;font-variant-numeric:tabular-nums}
.f label small.max{color:var(--red)}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.inp.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.row{display:flex;gap:8px}
.row .inp{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 15px;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{background:#f8fafc}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:#1a3f85}
.btn.del{color:var(--red);border-color:#fecaca}.btn.del:hover{background:#fef2f2}
.btn.del.cf{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.6;cursor:default}
/* xem truoc */
.pv{display:flex;align-items:center;gap:16px;border-radius:14px;padding:16px 18px;margin-bottom:16px;
  background:radial-gradient(300px 120px at 20% 50%,rgba(45,110,200,.45),transparent 70%),linear-gradient(135deg,#0a1a3b,#173f86)}
.pv .ic{width:72px;height:72px;border-radius:18px;box-shadow:0 10px 24px rgba(5,20,60,.5);flex:none}
.pv .ic svg{width:34px;height:34px}
.pv .t{min-width:0}
.pv .nm{color:#fff;font-size:16px;display:block}
.pv .ds{display:block;margin-top:3px}
.pv .u{display:block;font-size:11.5px;color:rgba(255,255,255,.45);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* chon icon */
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;max-height:156px;overflow:auto;padding:2px}
.icg button{aspect-ratio:1;border:1px solid var(--line);background:#f8fafc;border-radius:10px;display:grid;place-items:center;color:#1e3a8a;transition:.12s}
.icg button:hover{border-color:#93c5fd;background:#eff6ff}
.icg button.on{background:var(--navy);border-color:var(--navy);color:var(--yellow);box-shadow:0 0 0 3px rgba(18,48,106,.2)}
.icg svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* cong tac */
.sw{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#334155;cursor:pointer;user-select:none;padding:4px 0}
.sw input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:#cbd5e1;position:relative;cursor:pointer;transition:.15s;flex:none;margin:0}
.sw input:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.sw input:checked{background:var(--green)}
.sw input:checked:after{left:19px}
.sws{display:flex;gap:22px;flex-wrap:wrap}
.meta{font-size:11.5px;color:#94a3b8;margin-top:10px}

/* thong bao */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:60;background:#0f172a;color:#fff;border-radius:12px;padding:11px 18px;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.35);opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:#991b1b}

/* ===== Dien thoai ===== */
@media (max-width:640px){
  .top{padding:14px 18px}
  .logo{height:22px}
  .clock{font-size:12px}
  .gear{width:32px;height:32px}
  main{justify-content:flex-start;padding:65px 16px 24px}
  h1{font-size:30px}
  .lead{font-size:13.5px;margin-top:8px}
  .srch{margin-top:20px}
  .apps,.apps.many{gap:24px 12px;margin-top:30px;width:100%}
  .srch:not(.hidden) + .apps{margin-top:24px}
  .app,.apps.many .app{width:calc(50% - 6px);max-width:170px;gap:9px}
  /* icon dien thoai: 86 -> 69px (nho hon 20%) */
  .ic,.apps.many .ic{width:69px;height:69px;border-radius:18px;box-shadow:0 10px 22px rgba(5,20,60,.5)}
  .ic svg,.apps.many .ic svg{width:32px;height:32px}
  .ic:after{border-radius:18px}
  .tag,.apps.many .tag{top:50px;font-size:9.5px;padding:2px 7px}
  .ctl,.apps.many .ctl{top:-14px;right:calc(50% - 50px)}
  .ctl button{width:26px;height:26px}
  .ctl button svg{width:13px;height:13px}
  .nm{font-size:14.5px}
  .ds{font-size:12px;line-height:1.4;margin-top:-6px;padding:0 2px}
  .kh{display:none}
  .adm{width:calc(100% - 32px);font-size:13px;gap:6px;padding:8px 8px 8px 14px}
  .adm .who,.adm .lg{display:none}
  .adm .sm{display:inline}
  .ab{padding:8px 11px}
  body.edit .apps{row-gap:40px;margin-top:40px}
  body.edit main{padding-top:28px}
  .dh{padding:16px 18px 4px}.db{padding:8px 18px 4px}.df{padding:12px 18px 18px;flex-wrap:wrap}
}
@media (max-width:420px){ .clock .d{display:none} }
@media (max-width:760px){
  /* Ho tro IT gon: [nhan + ten] ben trai, nut Goi / Email ben phai */
  footer{padding:0 14px calc(10px + env(safe-area-inset-bottom))}
  .sup{display:grid;grid-template-columns:1fr auto auto;grid-template-rows:auto auto;column-gap:8px;row-gap:3px;align-items:center;
    padding:10px 10px 10px 16px;border-radius:14px}
  .sup-l{grid-column:1;grid-row:1;font-size:11.5px;letter-spacing:1.2px;gap:7px}
  .sup-l svg{width:15px;height:15px}
  .sup-r{display:contents}
  .sup-r .it{padding:0;font-size:13.5px}
  .sup-r .it + .it{border:0}
  .sup-r span.it{grid-column:1;grid-row:2;color:#fff;font-weight:500;min-width:0}
  .sup-r span.it svg{display:none}
  .sup-r span.it .tx{overflow:hidden;text-overflow:ellipsis}
  .sup-r a.it{grid-row:1 / 3;width:42px;height:42px;border-radius:12px;justify-content:center;background:rgba(255,255,255,.12);transition:background .15s}
  .sup-r a.it:active,.sup-r a.it:hover{background:rgba(245,197,24,.2)}
  .sup-r a.it svg{width:19px;height:19px}
  .sup-r a.it .tx{display:none}
  .copy{font-size:11px;margin-top:8px}
}
@media (prefers-reduced-motion:reduce){.ic,.ov,.dlg{transition:none;animation:none}}
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="logo-text.png" alt="KAMO" onerror="this.outerHTML='<span class=&quot;logo-txt&quot;>KAMO</span>'">
  <div class="tr">
    <span class="clock" id="clock"></span>
    <button class="gear" id="bGear" title="Cấu hình Portal (admin)" aria-label="Cấu hình Portal">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </button>
  </div>
</header>

<div class="adm hidden" id="adm">
  <span class="dot"></span><b><span class="lg">Chế độ cấu hình</span><span class="sm">Cấu hình</span></b><span class="who" id="admWho"></span>
  <span class="sp"></span>
  <button class="ab y" id="bAdd"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Thêm<span class="lg"> ứng dụng</span></button>
  <button class="ab g" id="bDone">Xong</button>
  <button class="ab r" id="bLogout" title="Đăng xuất admin">Đăng xuất</button>
</div>

<main>
  <h1>Kamo <span>IT Portal</span></h1>
  <p class="lead" id="lead">Chọn ứng dụng để bắt đầu</p>
  <div class="srch hidden" id="srch">
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Tìm ứng dụng…" autocomplete="off" aria-label="Tìm ứng dụng">
    <kbd>/</kbd>
  </div>
  <nav class="apps" id="apps" aria-label="Ứng dụng"></nav>
</main>

<footer>
  <div class="sup">
    <div class="sup-l">
      <svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="13.5" width="4" height="6" rx="1.5"/><rect x="17" y="13.5" width="4" height="6" rx="1.5"/></svg>
      HỖ TRỢ IT
    </div>
    <div class="sup-r">

async function api(path, {method='GET', body} = {}){
  const h = {'Accept':'application/json'};
  if (body !== undefined) h['Content-Type'] = 'application/json';
  if (S.admin) h.Authorization = 'Bearer ' + S.admin.token;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 10000);
  let r;
  try { r = await fetch(API + path, {method, headers:h, body: body === undefined ? undefined : JSON.stringify(body), signal: ctl.signal}); }
  catch { throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
  finally { clearTimeout(to); }
  const txt = await r.text(); let d = null; try { d = txt ? JSON.parse(txt) : null; } catch {}
  if (r.status === 401 && S.admin) { thoatAdmin(); throw new Error('Phiên quản trị đã hết hạn, vui lòng đăng nhập lại.'); }
  if (!r.ok) throw new Error((d && d.message) || ('Lỗi máy chủ (' + r.status + ').'));
  return d;
}

let dongDlg = null;
function moDlg(html, cls=''){
  dongLai();
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="dlg ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  let downOnOv = false;
  ov.addEventListener('mousedown', e => downOnOv = e.target === ov);
  ov.addEventListener('click', e => { if (e.target === ov && downOnOv) dongLai(); });
  ov.querySelectorAll('[data-close]').forEach(b => b.onclick = dongLai);
  dongDlg = () => ov.remove();
  return ov;
}

function moDangNhap(){
  const ov = moDlg(`

        <div class="err" id="adErr"></div>

      <div class="df"><span class="sp"></span><button type="button" class="btn" data-close>Hủy</button><button class="btn pri" id="bAdOk">Đăng nhập</button></div>
    </form>`, 'sm');
  const f = ov.querySelector('#fAd'); f.email.focus();
  f.onsubmit = async e => {
    e.preventDefault();
    const b = ov.querySelector('#bAdOk'), er = ov.querySelector('#adErr'); b.disabled = true; er.textContent = '';
    try {
      S.admin = null;
      const d = await api('/rpc/dang_nhap', {method:'POST', body:{email: f.email.value.trim(), mat_khau: f.mat_khau.value}});
      if (!d || d.loi) throw new Error(d && d.loi || 'Đăng nhập không thành công.');
      if (d.vai_tro !== 'admin') throw new Error('Tài khoản này không có quyền cấu hình Portal (chỉ admin).');
      let exp = Date.now() / 1000 + 12 * 3600;
      try { exp = JSON.parse(atob(d.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp || exp; } catch {}
      S.admin = {token: d.token, ho_ten: d.ho_ten, email: f.email.value.trim().toLowerCase(), exp};
      store.set('portal_admin', S.admin, sessionStorage);
      dongLai(); batSua();
    } catch(err) { er.textContent = err.message; f.mat_khau.select(); }
    finally { b.disabled = false; }
  };
}

  S.edit = true; S.q = ''; $('#q').value = '';

}

        <div class="f"><label>Diễn giải nội dung <small id="cMt"></small></label><input class="inp" name="mo_ta" maxlength="80" placeholder="VD: Tài khoản & dịch vụ CNTT" value="${esc(x.mo_ta)}"></div>
        <div class="f"><label>Đường dẫn (URL) *</label>
          <div class="row"><input class="inp" name="url" inputmode="url" placeholder="https://..." value="${esc(x.url)}"><button type="button" class="btn" id="bThu" title="Mở thử đường dẫn">${ui('ext')}Mở thử</button></div>
          <div class="hint">Dán đầy đủ địa chỉ trang, bắt đầu bằng https://</div></div>
        <div class="f"><label>Biểu tượng <small id="icNm"></small></label><div class="icg" id="icg">${keys.map(k => `<button type="button" data-ic="${k}" title="${esc(IC[k][0])}">${svg(k)}</button>`).join('')}</div></div>
        <div class="sws">
          <label class="sw"><input type="checkbox" name="dang_dung" ${x.dang_dung ? 'checked' : ''}>Hiển thị trên Portal</label>
          <label class="sw"><input type="checkbox" name="tab_moi" ${x.tab_moi ? 'checked' : ''}>Mở trong tab mới</label>
        </div>
        <div class="err" id="apErr"></div>
        ${!moi && x.cap_nhat_luc ? `<div class="meta">Cập nhật lần cuối: ${esc(new Date(x.cap_nhat_luc).toLocaleString('vi-VN'))}${x.cap_nhat_boi ? ' · ' + esc(x.cap_nhat_boi) : ''}</div>` : ''}
      </div>
      <div class="df">
        ${moi ? '' : `<button type="button" class="btn del" id="bDel">${ui('trash')}<span>Xóa</span></button>`}
        <span class="sp"></span>
        <button type="button" class="btn" data-close>Hủy</button>
        <button class="btn pri" id="bSave">${moi ? 'Thêm vào Portal' : 'Lưu thay đổi'}</button>
      </div>
    </form>`);
  const f = ov.querySelector('#fApp'), er = ov.querySelector('#apErr');
  const ve = () => {
    ov.querySelector('#pvIc').innerHTML = svg(icon);
    ov.querySelector('#pvNm').textContent = f.ten.value.trim() || 'Tên ứng dụng';
    ov.querySelector('#pvDs').textContent = f.mo_ta.value.trim() || 'Diễn giải nội dung';
    ov.querySelector('#pvU').textContent = f.url.value.trim();
    const c1 = ov.querySelector('#cTen'), c2 = ov.querySelector('#cMt');
    c1.textContent = f.ten.value.length + '/40'; c1.classList.toggle('max', f.ten.value.length >= 40);
    c2.textContent = f.mo_ta.value.length + '/80'; c2.classList.toggle('max', f.mo_ta.value.length >= 80);
    ov.querySelectorAll('[data-ic]').forEach(b => b.classList.toggle('on', b.dataset.ic === icon));
    ov.querySelector('#icNm').textContent = (IC[icon] || IC.grid)[0];
  };
  const chuanUrl = () => { let u = f.url.value.trim(); if (u && u !== 'https://' && !/^[a-z]+:\/\//i.test(u)) u = 'https://' + u; f.url.value = u; ve(); };
  f.addEventListener('input', e => { e.target.classList.remove('bad'); er.textContent = ''; ve(); });
  f.url.addEventListener('blur', chuanUrl);
  ov.querySelector('#icg').onclick = e => { const b = e.target.closest('[data-ic]'); if (b) { icon = b.dataset.ic; ve(); } };
  ov.querySelector('#bThu').onclick = () => { chuanUrl(); if (urlOk(f.url.value)) window.open(f.url.value, '_blank', 'noopener'); else { f.url.classList.add('bad'); er.textContent = 'Đường dẫn chưa hợp lệ.'; } };
  ve();
  (moi ? f.ten : f.ten).focus();
  // goi y icon theo ten khi them moi (neu chua tu chon)
  let tuChon = !moi;
  ov.querySelector('#icg').addEventListener('click', () => tuChon = true);
  f.ten.addEventListener('input', () => {
    if (tuChon) return;
    const t = bo_dau(f.ten.value), map = [['mail|email|thu',"mail"],['lich|calendar|hop',"calendar"],['luong|payroll|thanh toan|payment|bank',"card"],['nhan su|hr|nhan vien',"users"],['bao cao|report|dashboard',"chart"],['drive|cloud|luu tru',"cloud"],['nas|server|may chu',"server"],['in|printer',"printer"],['wifi|mang',"wifi"],['cham cong|gio',"clock"],['tai lieu|doc|van ban',"file"],['sheet|excel|bang',"table"],['huong dan|wiki|quy trinh',"book"],['ho tro|helpdesk|support',"headset"],['ticket|yeu cau',"ticket"],['mua|order|don hang',"cart"],['kho|tai san|asset',"box"],['giao hang|van chuyen',"truck"],['mat khau|password|bao mat',"lock"],['web|website',"globe"],['camera',"camera"],['chat|zalo|tin nhan',"chat"],['it|account|tai khoan',"shield"]];
    const m = map.find(([re]) => new RegExp('(^|\\s)(' + re + ')').test(t));
    icon = m ? m[1] : 'grid'; ve();
  });
  f.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) f.requestSubmit(); });
  f.onsubmit = async e => {
    e.preventDefault(); chuanUrl();
    const ten = f.ten.value.trim(), mo_ta = f.mo_ta.value.trim(), url = f.url.value.trim();
    if (!ten) { f.ten.classList.add('bad'); f.ten.focus(); er.textContent = 'Vui lòng nhập tên ứng dụng.'; return; }
    if (!urlOk(url) || url === 'https://') { f.url.classList.add('bad'); f.url.focus(); er.textContent = 'Đường dẫn chưa hợp lệ (cần bắt đầu bằng https://).'; return; }
    const b = ov.querySelector('#bSave'); b.disabled = true;
    try {
      await api('/rpc/luu_portal_ung_dung', {method:'POST', body:{id: x.id, ten, mo_ta, url, icon, dang_dung: f.dang_dung.checked, tab_moi: f.tab_moi.checked}});
      dongLai(); toast(moi ? 'Đã thêm "' + ten + '" vào Portal.' : 'Đã lưu thay đổi.'); await taiDs(true);
    } catch(err) { er.textContent = err.message; }
    finally { b.disabled = false; }
  };
  const bd = ov.querySelector('#bDel');
  if (bd) bd.onclick = async () => {
    if (!xacNhanXoa) { xacNhanXoa = true; bd.classList.add('cf'); bd.querySelector('span').textContent = 'Bấm lần nữa để xóa'; setTimeout(() => { if (bd.isConnected) { xacNhanXoa = false; bd.classList.remove('cf'); bd.querySelector('span').textContent = 'Xóa'; } }, 4000); return; }
    bd.disabled = true;
    try { await api('/rpc/xoa_portal_ung_dung', {method:'POST', body:{id: x.id}}); dongLai(); toast('Đã xóa "' + x.ten + '".'); await taiDs(true); }
    catch(err) { er.textContent = err.message; bd.disabled = false; }
  };
}

/* ----- An/hien nhanh, sap xep ----- */
async function anHien(x){
  try {
    await api('/rpc/luu_portal_ung_dung', {method:'POST', body:{id:x.id, ten:x.ten, mo_ta:x.mo_ta, url:x.url, icon:x.icon, dang_dung:!x.dang_dung, tab_moi:x.tab_moi}});
    toast(x.dang_dung ? 'Đã ẩn "' + x.ten + '".' : 'Đã hiện "' + x.ten + '".'); await taiDs(true);
  } catch(e) { toast(e.message, true); }
}
async function luuThuTu(ids){
  const cu = S.apps.slice();
  S.apps = ids.map(i => S.apps.find(x => x.id === i)).filter(Boolean); render();
  try { await api('/rpc/sap_xep_portal_ung_dung', {method:'POST', body:{ids}}); toast('Đã cập nhật thứ tự.'); }
  catch(e) { S.apps = cu; render(); toast(e.message, true); }
}
function doiCho(id, buoc){
  const ids = S.apps.map(x => x.id), i = ids.indexOf(id), j = i + buoc;
  if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]]; luuThuTu(ids);
}

/* ================= SU KIEN ================= */
$('#bGear').onclick = () => S.admin ? (S.edit ? tatSua() : batSua()) : moDangNhap();
$('#bAdd').onclick = () => moSua(null);
$('#bDone').onclick = tatSua;
$('#bLogout').onclick = () => { thoatAdmin(); toast('Đã đăng xuất quản trị.'); };
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const a = $('#apps .app[href]:not([href="#"])'); if (a) a.click(); }
  if (e.key === 'Escape') { e.target.value = ''; S.q = ''; render(); e.target.blur(); }
});
$('#apps').addEventListener('click', e => {
  if (!S.edit) { const a = e.target.closest('.app'); if (a && a.getAttribute('href') === '#') e.preventDefault(); return; }
  e.preventDefault();
  const a = e.target.closest('.app'); if (!a) return;
  if (a.dataset.add) return moSua(null);
  const x = S.apps.find(v => v.id == a.dataset.id); if (!x) return;
  const b = e.target.closest('[data-a]');
  if (!b) return moSua(x);
  if (b.dataset.a === 'vis') anHien(x);
  else doiCho(x.id, b.dataset.a === 'left' ? -1 : 1);
});
// keo tha (may tinh)
let keo = null;
$('#apps').addEventListener('dragstart', e => { const a = e.target.closest('.app[data-id]'); if (!S.edit || !a) return; keo = +a.dataset.id; a.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(keo)); } catch {} });
$('#apps').addEventListener('dragend', () => { keo = null; document.querySelectorAll('.app.drag,.app.over').forEach(a => a.classList.remove('drag','over')); });
$('#apps').addEventListener('dragover', e => { if (keo == null) return; const a = e.target.closest('.app[data-id]'); if (!a) return; e.preventDefault(); document.querySelectorAll('.app.over').forEach(o => o !== a && o.classList.remove('over')); if (+a.dataset.id !== keo) a.classList.add('over'); });
$('#apps').addEventListener('drop', e => {
  const a = e.target.closest('.app[data-id]'); if (keo == null || !a) return; e.preventDefault();
  const den = +a.dataset.id; if (den === keo) return;
  const ids = S.apps.map(x => x.id).filter(i => i !== keo); ids.splice(ids.indexOf(den) + (S.apps.findIndex(x => x.id === keo) < S.apps.findIndex(x => x.id === den) ? 1 : 0), 0, keo);
  luuThuTu(ids);
});
// phim tat
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && dongDlg) return dongLai();
  if (e.ctrlKey || e.metaKey || e.altKey || dongDlg || S.edit) return;
  const tg = e.target.tagName; if (tg === 'INPUT' || tg === 'TEXTAREA') return;
  if (e.key === '/' && !$('#srch').classList.contains('hidden')) { e.preventDefault(); $('#q').focus(); return; }
  const a = document.querySelector(`.app[data-key="${e.key}"]`); if (a) a.click();
});

/* ================= KHOI DONG ================= */
render();
taiDs();
if (S.admin) $('#admWho').textContent = '· ' + (S.admin.ho_ten || S.admin.email);
</script>
</body>
</html>
